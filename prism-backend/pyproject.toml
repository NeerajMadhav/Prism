[project]
name = "prism-backend"
version = "1.0.0"
description = "PRISM multi-cloud cost management backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "gunicorn>=22",
  "asyncpg>=0.29",
  "redis[asyncio]>=5.0",
  "celery[redis]>=5.4",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.0,<4.1",
  "cryptography>=42",
  "httpx>=0.27",
  "tenacity>=8.3",
  "slowapi>=0.1",
  "structlog>=24",
  "boto3>=1.34",
  "azure-identity>=1.16",
  "azure-mgmt-costmanagement>=4.0",
  "google-cloud-bigquery>=3.20",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
  "factory-boy>=3.3",
  "freezegun>=1.4",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI `Depends(...)` / `Query(...)` in defaults is the framework pattern.
# BLE001: many worker/IO boundaries intentionally catch broad Exception and log.
ignore = ["B008", "BLE001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
